config_type: "embedding_generation" # options: data_preprocessor, host_prediction, evaluation, transfer_learning, embedding_generation

# Input Settings:
  ## initialize base input folder name
  ## provide path to dataset folder
input_settings:
  # Base input directory
  input_dir: "input/data/uniref90_coronaviridae"
  # Name of file(s) in subdirectory to be read and processed.
  # Example: file_names: ["file_1.csv", "file_2.csv", "file_3.csv"]
  # file_names: [ "uniref90_final_msl1114.csv" ]
  file_names: [ "uniref90_coronaviridae_s_valid_embl_hosts_w_correction_metadata_species_vertebrates_w_seq.csv" ]
  # seeds to split the files into training and testing
  # if provided, the number of seeds must match the number of iterations configured in classification_settings (n_iterations)
  split_seeds: [ 12612648, 31062180, 48918293, 55631155, 79221635 ]

sequence_settings:
    batch_size: 16
    id_col: "uniref90_id"
    sequence_col: "seq"
    label_col: "virus_host_name"
    metadata_cols: ["uniref90_id", "virus_host_name", "virus_name", "virus_taxon_rank", "virus_host_tax_id", "virus_host_taxon_rank"]
    split: False
    truncate: False
    feature_type: "token"  # supported values 'kmer', 'cgr', 'token'

models:
  - id: "hybd_attn_msl256s64ae_bn_cls_fnn_2l_d1024_lr1e-4"
    name: "HAVEN"
    active: True
    segment_len: 256
    stride: 64
    cls_token: True
    pre_train_settings:
      encoder_settings:
        model_name: "transformer_encoder-l_6-h_8-lr1e-4-mlm"
        model_path: "output/raw/uniref90-viridae/pre-training/mlm/20240821/transformer_encoder-l_6-h_8-lr1e-4_msl256_b512_splitseq_mlm_vs30cls_allemb_itr0.pth"
        n_heads: 8
        depth: 6
        input_dim: 512 # input embedding dimension
        hidden_dim: 1024
        max_seq_len: 256


output_settings:
  output_dir: "output"
  results_dir: "raw"
  sub_dir: "coronaviridae_s_prot_uniref90_embl_vertebrates/embedding/20240618"
  prefix: "mlm_tfenc_l6_h8_lr1e-4_uniref90viridae_vs30cls" # default: none; default file name = kmer_k<k>_lr_c<c>_<label>_<type>_tr<train_proportion>_n<n_iterations>_<output_prefix>_output.csv
